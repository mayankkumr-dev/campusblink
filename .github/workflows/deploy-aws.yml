name: Deploy Backend to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only trigger if backend-related files change, to save on actions minutes.
    # Remove the `paths` section if you want to deploy to AWS on EVERY push.
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/deploy-aws.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the app directory and run the deployment script
            cd /app/campusblink
            git stash || true
            bash deploy/github-deploy.sh
            git stash pop || true
