<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline | Campus Blink</title>
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --accent: #f5f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --text: #f5f5f7;
        --text-muted: #86868b;
        --accent: #1c1c1e;
      }
      .button {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }
    .icon-container {
      width: 96px;
      height: 96px;
      background-color: var(--accent);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      animation: float 4s ease-in-out infinite;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    @media (prefers-color-scheme: dark) {
      .icon-container {
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      }
    }
    .icon-container svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 16px 0;
      letter-spacing: -0.6px;
    }
    p {
      font-size: 17px;
      color: var(--text-muted);
      margin: 0 0 40px 0;
      max-width: 320px;
      line-height: 1.4;
      font-weight: 500;
    }
    .button {
      background-color: #000000;
      color: #ffffff;
      border: none;
      border-radius: 100px;
      padding: 16px 40px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      letter-spacing: -0.3px;
    }
    .button:active {
      transform: scale(0.96);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <!-- Wi-Fi Off Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.172 9.172a4 4 0 015.656 0M6.343 6.343a8 8 0 0111.314 0M3.515 3.515a12 12 0 0116.97 0" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>Please check your Wi-Fi or cellular network and try again.</p>
  <button class="button" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
