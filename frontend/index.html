    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background-color: #ffffff; /* pure white for PWA */
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        background: var(--bg-primary);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease;
      }
      html.dark #app-splash {
        background: #101113 !important;
      }
      #app-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-inner {
        width: min(180px, 50vw);
        text-align: center;
      }
      .splash-logo {
        width: 100%;
        height: auto;
        display: block;
      }
      .splash-progress {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(26, 45, 92, 0.16);
        overflow: hidden;
      }
      .splash-progress::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: #2D4EF5;
        animation: splash-load 1.2s linear infinite;
      }
      @keyframes splash-load {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>

  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme');
          var isDark = theme === 'dark' || ((theme === 'system' || !theme) && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || document.documentElement.classList.contains('dark');
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-inner">
        <img class="splash-logo" id="splash-logo-img" src="/logo2/Blue_transparent.png?v=4" alt="Campus Blink" />
      </div>
      <div class="splash-progress"></div>
    </div>
    <script>
      (function() {
        try {
          if (document.documentElement.classList.contains('dark')) {
            var splashLogo = document.getElementById('splash-logo-img');
            if (splashLogo) {
              splashLogo.src = '/logo2/splash_white_transparent.png';
            }
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
