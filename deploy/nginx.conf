# ============================================================
# CampusBlink — Nginx Configuration
# Routes all traffic to the Node.js backend on port 3000.
# Handles WebSocket upgrades for Socket.io.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/campusblink
#   sudo ln -s /etc/nginx/sites-available/campusblink /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Upstream — Node.js backend
upstream campusblink_backend {
    # With PM2 cluster mode running on port 3000, nginx forwards here
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP Server (redirects to HTTPS once SSL is set up) ─────
server {
    listen 80;
    server_name _;   # Accepts any hostname / raw EC2 IP

    # Before you have a domain, serve HTTP directly.
    # Once you add a domain + SSL certificate, this block
    # redirects to HTTPS (see commented section below).

    # Increase body size limit for file uploads (Cloudinary multipart)
    client_max_body_size 50M;

    # ── Health check ──────────────────────────────────────
    location /health {
        proxy_pass         http://campusblink_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Socket.io — WebSocket upgrades ────────────────────
    location /socket.io/ {
        proxy_pass         http://campusblink_backend;
        proxy_http_version 1.1;

        # CRITICAL: These headers enable WebSocket upgrade
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket timeout settings
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 60s;
    }

    # ── All API routes ─────────────────────────────────────
    location / {
        proxy_pass         http://campusblink_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

